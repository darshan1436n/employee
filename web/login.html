<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login / Register | Shiftly</title><link rel="stylesheet" href="/css/style.css"></head><body><div class="notice">Shiftly · Student Temporary Jobs Platform</div><header class="nav"><a class="brand" href="/"><span class="logo">▣</span> Shiftly</a><nav><a href="/">Home</a><a href="/jobs.html">Find Jobs</a><a href="/login.html" class="active">Login / Register</a></nav></header><main class="login-wrap"><h1>Welcome to Shiftly</h1><p class="muted">Log in to your account or create a student account.</p><section class="panel login-panel"><div class="tab-row"><button type="button" id="showLogin">Login</button><button type="button" class="secondary" id="showRegister">Register</button></div><form id="loginForm"><label>Email or admin username</label><input id="loginEmail" required placeholder="you@example.com or admin"><label>Password</label><input id="loginPassword" type="password" required><button class="full">Login</button></form><form id="registerForm" class="hidden"><label>Full name</label><input id="regName" required><label>Email</label><input id="regEmail" type="email" required><label>Phone number</label><input id="regPhone" required><label>College</label><input id="regCollege"><label>Password (minimum 6 characters)</label><input id="regPassword" type="password" minlength="6" required><button class="full">Create account</button></form><div class="hint"><b>Admin login:</b> username <code>admin</code>, password <code>admin123</code>.</div><div id="authMessage" class="message"></div></section></main><footer><b>Shiftly – Student Temporary Jobs Platform</b><p>Academic demonstration with sample data.</p></footer><script src="/js/app.js"></script></body></html>
